<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Course Management</h1>
        <p>Manage your courses</p>

        <section class="form-section">
            <h2>Add New Course</h2>

            <form id="course-form">
                <div>
                    <label for="course-name">Course Name</label>
                    <input
                        type="text"
                        id="course-name"
                        placeholder="Enter course name"
                        required
                    >
                </div>

                <div>
                    <label for="course-credits">Credits</label>
                    <input
                        type="number"
                        id="course-credits"
                        min="1"
                        max="6"
                        placeholder="Enter credits (1-6)"
                        required
                    >
                </div>

                <button type="submit" id="submit-btn">
                    Add Course
                </button>
            </form>
        </section>

        <section class="form-section" id="edit-section" hidden>
            <h2>Edit Course</h2>

            <form id="edit-form">
                <div>
                    <label for="edit-name">Course Name</label>
                    <input type="text" id="edit-name" required>
                </div>

                <div>
                    <label for="edit-credits">Credits</label>
                    <input type="number" id="edit-credits" min="1" max="6" required>
                </div>

                <button type="submit" id="save-edit-btn">Save Changes</button>
                <button type="button" id="cancel-edit-btn">Cancel</button>
            </form>
        </section>

        <section class="courses-section">
            <h2>Course List</h2>

            <p id="status"></p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Course Name</th>
                        <th>Credits</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="course-list">
                    <!-- Courses will appear here -->
                </tbody>
            </table>
        </section>
    </div>

</body>
</html>
